version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: syncboard_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: syncboard_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/syncboard
      - JWT_SECRET=syncboard_production_super_secret_jwt_key
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: syncboard_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data: